apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Akrami.xyz</title>
        <style>
            body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
            .container { text-align: center; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
            h1 { color: #1a73e8; }
            p { color: #5f6368; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Welcome to Akrami.xyz</h1>
            <p>This is a simple demo page running on a k3s dual-stack cluster.</p>
            <p>Managed by Gemini CLI 🚀</p>
        </div>
    </body>
    </html>
