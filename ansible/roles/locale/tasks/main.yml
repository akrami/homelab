---
- name: Install locales package
  ansible.builtin.apt:
    name: locales
    state: present

- name: Ensure en_US.UTF-8 locale is generated
  ansible.builtin.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Update default locale file
  ansible.builtin.copy:
    content: |
      LANG=en_US.UTF-8
      LC_ALL=en_US.UTF-8
    dest: /etc/default/locale
    mode: '0644'
